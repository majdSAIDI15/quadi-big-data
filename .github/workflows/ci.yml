name: CI

on:
  push:
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires pur Python
        run: pytest -q -m "not spark"

      - name: Tests Spark (GraphFrames + Delta Lake)
        env:
          CHECKPOINT_DIR: /tmp/ckpt
        run: pytest -q -m spark

      - name: DDL Delta (livrable 3)
        run: python fraud_graph_delta_schema.py --print-ddl > ddl.sql && head -40 ddl.sql
