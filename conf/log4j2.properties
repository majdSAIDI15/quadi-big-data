# Logs Spark lisibles pendant la démo : WARN global, bruit connu en ERROR.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n%ex
logger.state.name = org.apache.spark.sql.execution.streaming.state
logger.state.level = error
logger.fair.name = org.apache.spark.scheduler.FairSchedulableBuilder
logger.fair.level = error
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
logger.kafka010.name = org.apache.spark.sql.kafka010
logger.kafka010.level = error
logger.exec.name = org.apache.spark.sql.execution.streaming.ProcessingTimeExecutor
logger.exec.level = error
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
logger.blockmgr.name = org.apache.spark.storage
logger.blockmgr.level = error
logger.window.name = org.apache.spark.sql.execution.window
logger.window.level = error
