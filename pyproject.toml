[project]
name = "fraud-graph-analytics"
version = "1.0.0"
description = "Mini-Projet 17 — détection de blanchiment et de fraude carrousel par Graph Analytics en streaming"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spark: tests nécessitant une session Spark (GraphFrames + Delta)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_report.py" = ["E501"]  # feuille de style CSS embarquée
